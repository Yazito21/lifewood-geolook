<style>
/* Nocturne 设计系统令牌（取自设计稿 styles.css，暗色单主题） */
:root{
  --bg:#143021; --surface:#223c2c; --side:#193526; --deep:#193526;
  --text:#f5eedb; --t400:#c2c3b0; --t500:#a0a695; --t600:#7f8a79; --t700:#5f6f5f;
  --accent:#ffb246; --a100:#fff8ef; --a300:#ffe1b8; --a400:#ffcd87;
  --a700:#9f7d37; --a800:#695f2e; --a900:#384427;
  --n800:#405546; --n900:#263f30;
  --good:#0e3c29; --good-text:#c0d3cc;
  --divider:rgba(245,238,219,0.16); --line:rgba(245,238,219,0.08);
  --r-md:8px; --r-lg:14px;
  --sh-sm:0 0 0 1px #405546; --sh-md:0 0 0 1px #5f6f5f,0 6px 18px rgba(0,0,0,.55);
  --font:"Inter",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--font)}
h1,h2,h3,h4{font-weight:500;line-height:1.12;letter-spacing:-.015em;margin:0 0 6px}
h2{font-size:32px} h3{font-size:25px} h4{font-size:20px}
p{margin:0 0 8px}
a{color:var(--accent);text-underline-offset:3px}
::selection{background:rgba(255,178,70,.3)}
:focus{outline:none} :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#405546;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  font:500 14px/1.2 var(--font);color:var(--text);background:transparent;
  border:1px solid transparent;padding:7px 12px;border-radius:var(--r-md);text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{color:var(--accent);border-color:var(--accent)}
.btn-primary:hover{background:rgba(255,178,70,.12)}
.btn-secondary{border-color:var(--divider)}
.btn-secondary:hover{background:rgba(245,238,219,.07)}
.btn-ghost{color:var(--accent);padding-inline:4px}
.btn-ghost:hover{background:rgba(255,178,70,.10)}
.btn-block{width:100%}
.card{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r-md);background:var(--surface)}
.elev{box-shadow:var(--sh-sm)}
.kicker{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:6px;white-space:nowrap}
.tag-accent{background:var(--a800);color:var(--a100)}
.tag-neutral{background:var(--n800);color:var(--text)}
.tag-dim{background:var(--n900);color:var(--t500)}
.tag-outline{border:1px solid var(--accent);color:var(--accent);background:transparent}
.pill-good{background:var(--good);color:var(--good-text)}
.pill-warn{background:var(--n800);color:var(--text)}
.tbl{overflow-x:auto}
.tbl .table{min-width:820px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--t600);padding:6px 8px;white-space:nowrap}
.table td{padding:8px;vertical-align:top}
.table thead tr{background:linear-gradient(to right,transparent,var(--divider) 48px,var(--divider) calc(100% - 48px),transparent) no-repeat bottom/100% 1px}
.table tbody tr{background:linear-gradient(to right,transparent,var(--line) 48px,var(--line) calc(100% - 48px),transparent) no-repeat bottom/100% 1px}
.table tbody tr:hover{background:
  linear-gradient(rgba(245,238,219,.04),rgba(245,238,219,.04)) no-repeat 0 0/100% 100%,
  linear-gradient(to right,transparent,var(--line) 48px,var(--line) calc(100% - 48px),transparent) no-repeat bottom/100% 1px}
.field>label{display:block;font-size:12px;margin-bottom:5px;color:rgba(245,238,219,.7)}
.input{width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;color:var(--text);
  caret-color:var(--accent);background:var(--surface);border:1px solid var(--divider);border-radius:var(--r-md)}
.input:hover{border-color:rgba(245,238,219,.45)}
.input:focus-visible{border-color:var(--accent);outline-offset:0}
textarea.input{min-height:90px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.7}
.seg{display:inline-flex;overflow:hidden;border:1px solid var(--divider);border-radius:var(--r-md)}
.seg-opt{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;cursor:pointer}
.seg-opt+.seg-opt{border-left:1px solid var(--divider)}
.seg-opt input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.seg-opt:has(input:checked){color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg-opt:not(:has(input:checked)):hover{background:rgba(245,238,219,.07)}
.tabs{display:inline-flex;background:var(--surface);border-radius:11px;padding:4px;gap:2px;box-shadow:var(--sh-sm)}
.tab{border:0;background:none;color:var(--t500);font:500 13.5px/1 var(--font);padding:9px 18px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:color .12s,background .12s}
.tab:hover{color:var(--t400)}
.tab.on{background:var(--accent);color:#143021}
.tab .cnt{font-size:11px;padding:1px 7px;border-radius:99px;background:rgba(245,238,219,.10);color:var(--t500)}
.tab.on .cnt{background:rgba(20,48,33,.22);color:#143021}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.muted{color:var(--t600)} .soft{color:var(--t400)}
pre.log{background:var(--deep);border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:13px 15px;
  font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:400px;overflow:auto;
  white-space:pre-wrap;margin:0;color:var(--t400)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--accent);border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;right:20px;bottom:20px;background:var(--surface);box-shadow:var(--sh-md);
  border-left:3px solid var(--accent);border-radius:var(--r-md);padding:11px 16px;z-index:90;
  font-size:13px;max-width:400px;animation:sl .2s ease-out}
@keyframes sl{from{transform:translateY(8px);opacity:0}}
.toast.err{border-left-color:#d55}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.6);display:grid;place-items:center;z-index:60;padding:24px}
.modal .box{background:var(--surface);border-radius:var(--r-lg);padding:22px 24px;max-width:620px;width:100%;
  box-shadow:var(--sh-md);max-height:88vh;overflow:auto}
.bar{height:7px;border-radius:4px;background:var(--deep);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#9f7d37,#ffb246)}
.uln{box-shadow:inset 0 -2px 0 var(--accent);padding-bottom:1px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.spec{display:grid;grid-template-columns:repeat(4,auto);gap:26px;justify-content:start}
.spec .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t600)}
.spec .v{font-size:12.5px;margin-top:2px}

#side{width:236px;flex:none;display:flex;flex-direction:column;gap:18px;padding:18px 12px 20px;
  background:var(--side);box-shadow:inset -1px 0 0 rgba(245,238,219,.10);
  position:sticky;top:0;height:100vh;overflow:auto}
.navgrp{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t600);padding:0 8px 4px}
.navit{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;cursor:pointer;
  font:inherit;font-size:13px;padding:7px 8px;border-radius:6px;background:transparent;color:var(--t400)}
.navit:hover{background:rgba(245,238,219,.05)}
.navit.on{background:var(--a900);color:var(--text)}
.navit .mark{width:2px;height:14px;border-radius:2px;flex:none;background:transparent}
.navit.on .mark{background:var(--accent)}
.navit .bdg{margin-left:auto;font-size:10.5px;color:var(--t600)}

/* KPI 栅格与工作台三栏用 class 而非内联样式，方便窄屏媒体查询覆盖 */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}
.kpis.six{grid-template-columns:repeat(6,1fr)}
.wb3{display:grid;grid-template-columns:262px minmax(360px,1fr) 300px;gap:14px;align-items:start;overflow-x:auto}
#burger{display:none;position:fixed;top:10px;left:10px;z-index:70}
@media (max-width:1100px){
  .wb3{grid-template-columns:1fr;overflow-x:visible}
}
@media (max-width:900px){
  #burger{display:inline-flex}
  #side{position:fixed;left:-260px;transition:left .2s;z-index:50}
  #side.open{left:0}
  #main{margin-left:0;padding-top:52px}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<button id="burger" class="btn btn-secondary" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
<div style="display:flex;align-items:stretch;min-height:100vh">
  <aside id="side"></aside>
  <main id="main" style="flex:1;min-width:0"><div id="view"></div></main>
</div>
<div id="modal"></div><div id="toast"></div>

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>v==null?'—':(v*100).toFixed(v>0&&v<0.095?1:0)+'%';
// 非 2xx 也尽量读 body：服务端错误响应带具体原因（如「缺凭证：GITHUB_TOKEN」），
// 只报 HTTP 状态码会把可行动的信息丢掉
const api=async(u,o)=>{try{const r=await fetch(u,o);const j=await r.json().catch(()=>null);
  if(!r.ok)return (j&&j.error)?j:{error:`HTTP ${r.status}`};
  return j??{error:'响应不是 JSON'}}catch(e){return{error:'连接失败：服务未响应'}}};
const mktLabel=m=>m==='cn'?'国内':m==='global'?'海外':'通用';
const diagTag=d=>{if(!d)return'<span style="font-size:12px;color:var(--t600)">—</span>';
  const cls=d.sev==='P0'?'tag-accent':d.sev==='P1'?'pill-warn':d.sev==='P2'?'tag-dim':'pill-good';
  return `<span class="tag ${cls}" title="${esc(d.detail)}" style="cursor:help">${esc(d.type)}</span>`};
function distRows(list,me){ // 品牌提及分布条：me=自己品牌名高亮
  const max=((list||[])[0]||{}).rate||1;
  return (list||[]).map(x=>{const mine=x.name===me;
    return `<div class="row" style="gap:8px;padding:4px 0">
      <span style="width:132px;flex:none;font-size:12.5px;${mine?'color:var(--a300)':''};overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(x.name)}">${esc(x.name)}${mine?' ⭑':''}</span>
      <div class="bar" style="flex:1;height:6px"><div style="height:100%;width:${Math.max(3,Math.round(x.rate/max*100))}%;background:${mine?'var(--a400)':'#5f6f5f'};border-radius:4px"></div></div>
      <span style="width:86px;flex:none;text-align:right;font-size:11.5px;color:var(--t400)">${pct(x.rate)} · ${x.hits} 次</span></div>`}).join('')
    ||'<div class="muted" style="font-size:12px">本期没有实体被提及</div>';
}
function progBar(p,f,w){ // 任务级 before/after：首测(f) → 当前(p) → 目标
  if(!p)return'';
  const fmt=v=>v==null?'—':(p.pct?pct(v):v),op=p.op==='lte'?'≤':'≥';
  let ratio; // 完成度：lte 型看从基线降到目标走了多远；gte 型看距目标比例
  if(p.op==='lte'){const b=(f&&f.cur!=null?f.cur:null)??p.base??Math.max(p.cur,p.target,1);
    ratio=b>p.target?(b-p.cur)/(b-p.target):(p.cur<=p.target?1:0)}
  else ratio=p.target?p.cur/p.target:0;
  ratio=Math.max(0,Math.min(1,ratio));
  return `<div style="margin-top:5px;max-width:280px">
    <div style="font-size:11px;color:var(--t500)">${esc(p.label)}：首测 ${fmt(f&&f.cur)} → 当前 <b style="color:var(--t300)">${fmt(p.cur)}</b> · 目标 ${op}${fmt(p.target)}</div>
    <div class="bar" style="margin-top:3px;height:5px"><div style="height:100%;width:${Math.round(ratio*100)}%;background:${ratio>=1?'var(--a400)':'var(--accent)'};border-radius:4px"></div></div></div>`}
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
let D=null,SLUG=null,R='overview',ACTIONS={},POLL=null,RUNNING=null,LASTJOB=null,LOGOFF=0;
let ST={gapTab:'content',engSel:null,wq:null,obStep:1,obSlug:null,obNoSample:false,obFail:false,obUrl:'',obName:'',obMkt:'both'};

function toast(m,k=''){const t=document.createElement('div');t.className='toast '+k;t.textContent=m;
  $('#toast').appendChild(t);setTimeout(()=>t.remove(),3800)}
function modal(h){$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box">${h}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}
function go(r,extra,fromPop){R=r;Object.assign(ST,extra||{});
  // 接入浏览器历史：每次页面跳转压一条记录，后退/前进在应用内导航而不是退出应用
  if(!fromPop)history.pushState({r,engSel:ST.engSel,gapTab:ST.gapTab,wq:(extra||{}).wq||null},'','#'+r);
  render();scrollTo(0,0);$('#side').classList.remove('open')}
window.addEventListener('popstate',e=>{const s=e.state;if(!s||!s.r)return;
  if(s.engSel!==undefined)ST.engSel=s.engSel;
  if(s.gapTab)ST.gapTab=s.gapTab;
  if(s.r==='workbench'&&s.wq)ST.wq=s.wq;
  go(s.r,null,true)});
function head(kicker,title,sub){return `<div class="kicker">${esc(kicker)}</div>
  <h3 style="margin-bottom:6px">${title}</h3>
  ${sub?`<p class="soft" style="font-size:14px;max-width:700px;text-wrap:pretty">${sub}</p>`:''}`}

/* ===================== 界面多语言(zh/en/ja) =====================
   中文是源文案。en/ja 用「整句精确匹配 + 短节点词级替换」在渲染后翻译 DOM,

const ULANG=(()=>{
  const q=new URLSearchParams(location.search).get('lang');
  if(['zh','en','ja'].indexOf(q)>=0){try{localStorage.setItem('ulang',q)}catch(e){}return q}
  const s=localStorage.getItem('ulang');if(['zh','en','ja'].indexOf(s)>=0)return s;
  const l=(navigator.language||'').toLowerCase();
  return l.indexOf('zh')===0?'zh':l.indexOf('ja')===0?'ja':'en'})();
document.documentElement.lang={zh:'zh-CN',en:'en',ja:'ja'}[ULANG]||'zh-CN';

// Recursive lookup used when a Chinese fragment (e.g. a task title) is embedded inside

function trText(t){
  if(ULANG==='zh'||!t)return t;
  const d=UI_D[ULANG];
  if(d[t]!=null)return d[t];
  for(const[rx,tpl]of UI_RX[ULANG])if(rx.test(t))return t.replace(rx,tpl);
  return t;
}

function uiTranslate(root){
  if(ULANG==='zh'||!root)return;
  const d=UI_D[ULANG],subs=UI_SUB[ULANG];
  if(root.nodeType===3){const t=root.nodeValue.trim();if(!t)return;
    if(d[t]!=null){root.nodeValue=root.nodeValue.replace(t,d[t]);return}
    for(const[rx,tpl]of UI_RX[ULANG])if(rx.test(t)){root.nodeValue=root.nodeValue.replace(t,t.replace(rx,tpl));return}
    if(t.length<=40){/* 词级替换仅当节点由已知词元+数字/标点组成——避免误伤数据文本 */
      let probe=t;for(const s of subs)probe=probe.split(s[0]).join('');
      if(!/[぀-ヿ一-鿿]/.test(probe)){
        let v=root.nodeValue;for(const s of subs)v=v.split(s[0]).join(s[1]);root.nodeValue=v}}
    return}
  if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(uiTranslate);
  (root.querySelectorAll?root.querySelectorAll('[title],[placeholder]'):[]).forEach(el=>{
    ['title','placeholder'].forEach(a=>{const v=el.getAttribute(a);if(v&&d[v]!=null)el.setAttribute(a,d[v])})});
}
new MutationObserver(ms=>{if(ULANG==='zh')return;
  for(const m of ms)m.addedNodes.forEach(n=>uiTranslate(n))
}).observe(document.body,{childList:true,subtree:true});

let SAMP={cfg:null,questions:[],engines:[],mode:'all',custom:new Set(),search:'',repeat:1,selected:new Set()};

function samplingQuestionType(q){
  const g=String(q.group||'').toLowerCase();
  return q.brand_probe || q.market==='both' || g.includes('品牌验证') || g.includes('brand check') ? 'brand'
    : (g==='推荐'||g==='recommend') ? 'recommend' : 'other';
}

function samplingRenderQuestions(){
  const box=$('#sampling-question-list');
  if(!box||!SAMP.questions)return;
  const term=(SAMP.search||'').trim().toLowerCase();
  const mode=SAMP.mode;
  const rows=SAMP.questions.filter(function(q){
    const type=samplingQuestionType(q);
    const modeOk=mode==='all'||(mode==='recommend'&&type==='recommend')||(mode==='brand'&&type==='brand')||(mode==='custom'&&SAMP.custom.has(String(q.id)));
    const txt=(String(q.id||'')+' '+String(q.text||'')).toLowerCase();
    return modeOk&&(!term||txt.includes(term));
  });
  box.innerHTML=rows.length?rows.map(function(q){
    const id=String(q.id||'');
    return '<label class="row" style="gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer">'+
      '<input type="checkbox" value="'+esc(id)+'" '+(SAMP.custom.has(id)?'checked':'')+
      ' onchange="samplingToggleQuestion(\''+esc(id)+'\',this.checked)" style="accent-color:var(--a400)">'+
      '<span style="font-size:11px;color:var(--a300);width:42px;flex:none">'+esc(id)+'</span>'+
      '<span style="font-size:12px;line-height:1.45">'+esc(q.text||'')+'</span></label>';
  }).join(''):'<div class="muted" style="padding:10px">没有符合条件的问题</div>';
  const count=mode==='all'?SAMP.questions.length:
    mode==='recommend'?SAMP.questions.filter(function(q){return samplingQuestionType(q)==='recommend'}).length:
    mode==='brand'?SAMP.questions.filter(function(q){return samplingQuestionType(q)==='brand'}).length:SAMP.custom.size;
  const el=$('#sampling-question-count');if(el)el.textContent=count+' 题';
}

function samplingToggleQuestion(id,checked){
  if(checked)SAMP.custom.add(id);else SAMP.custom.delete(id);
  samplingRenderQuestions();
}

function samplingSetMode(mode){
  SAMP.mode=mode;
  document.querySelectorAll('input[name="sampling-mode"]').forEach(function(x){x.checked=x.value===mode});
  const custom=$('#sampling-custom');
  if(custom)custom.style.display=mode==='custom'?'block':'none';
  samplingRenderQuestions();
}

function samplingToggleEngine(code,checked){
  if(checked)SAMP.selected.add(code);else SAMP.selected.delete(code);
}

async function startSamplingFromModal(){
  const platforms=[...SAMP.selected];
  if(!platforms.length){toast('至少选择一个已配置的自动化引擎','err');return}
  const repeat=Math.max(1,Math.min(3,parseInt($('#sampling-repeat').value||'1',10)||1));
  let qids=[];
  if(SAMP.mode==='recommend')qids=SAMP.questions.filter(function(q){return samplingQuestionType(q)==='recommend'}).map(function(q){return String(q.id)});
  else if(SAMP.mode==='brand')qids=SAMP.questions.filter(function(q){return samplingQuestionType(q)==='brand'}).map(function(q){return String(q.id)});
  else if(SAMP.mode==='custom')qids=[...SAMP.custom];
  const job=await runAction('sample',{platforms:platforms.join(','),repeat:repeat,question_ids:qids.join(',')});
  if(job)closeModal();
}

async function runAction(a,params){
  const r=await post('/api/run',{slug:SLUG,action:a,params:params||{}});
  if(!r.ok){toast(r.error||'启动失败','err');return null}
  RUNNING=r.job.id;LASTJOB=r.job.id;LOGOFF=0;renderSide();pollJob();
  toast('已启动：'+((ACTIONS[a]||{}).label||a));return r.job;
}
async function pollJob(){
  clearTimeout(POLL); if(!RUNNING)return;
  const r=await api(`/api/job/${RUNNING}?offset=${LOGOFF}`);
  if(r.error){RUNNING=null;renderSide();toast('任务状态丢失','err');return}
  LOGOFF=r.offset;
  const pre=$('#joblog'); if(pre&&r.log){pre.textContent+=r.log;pre.scrollTop=pre.scrollHeight}
  const st=$('#jobstat'); if(st)st.innerHTML=r.job.status==='running'
    ?`<span class="spin"></span>${esc(r.job.label)} 运行中…`
    :`${r.job.status==='done'?'✓':'✗'} ${esc(r.job.label)} ${({done:'完成',failed:'失败',stopped:'已停止',interrupted:'已中断'})[r.job.status]||r.job.status}`;
  if(r.job.status==='running'){POLL=setTimeout(pollJob,900)}
  else{RUNNING=null;
    toast(`${r.job.label} ${r.job.status==='done'?'完成':'结束'}`,r.job.status==='done'?'':'err');
    if(R==='onboard'&&ST.obStep===2){
      if(r.job.status==='done'){ST.obFail=false;ST.obStep=3;await load(SLUG,true);return}
      ST.obFail=true;render();return}
    await load(SLUG,true)}
}

function headline(){
  const a=D.analytics,h=a.health,tr=a.trend||[];
  if(h.score==null)return['还没有采样数据','到「设置 → 运行任务」跑一期，才能开始诊断。'];
  const prev=tr.length>1?tr[tr.length-2]:null;
  const dm=prev&&prev.mention!=null&&tr[tr.length-1].mention!=null?((tr[tr.length-1].mention-prev.mention)*100).toFixed(1):null;
  const cite=h.subs.cite,m=h.subs.mention;
  if((m||0)===0)return['AI 还没有主动提到过你',
    `最近一期 ${tr.length?tr[tr.length-1].samples:0} 条采样中无提示提及率为 0——不是排名靠后，是还没进入候选集。先补内容缺口和 P0 阵地，不是继续铺渠道。`];
  if((cite||0)<0.05)return['AI 开始提到你了，但几乎不引用你',
    `提及率 ${pct(m)}${dm?`（较上期 ${dm>0?'+':''}${dm}pp）`:''}，但引用份额只有 ${pct(cite)}——「有人在说你」而「你没有可引用的落点」。优先补可被抽取的内容。`];
  return['提及与引用同步在涨',`提及率 ${pct(m)}、引用份额 ${pct(cite)}。保持内容节奏，开始扩阵地。`];
}

/* ===================== 拓词（真实搜索需求） ===================== */
function demandTag(qid){
  const d=EXPD&&EXPD.q_demand&&EXPD.q_demand[qid];
  if(!d)return'';
  const tip=`匹配 ${d.n} 条下拉词：${(d.terms||[]).join(' / ')}`;
  return ` <span class="tag ${d.new?'tag-accent':'tag-dim'}" style="font-size:10px" title="${esc(tip)}">🔥 ${d.new?'需求上升':'有搜索需求'}</span>`;
}
function demandRank(qid){const d=EXPD&&EXPD.q_demand&&EXPD.q_demand[qid];return d?(d.new?2:1):0}
function demandSort(qs){
  if(!EXPD)return qs;
  const idx=new Map(qs.map((q,i)=>[q.id,i]));
  return qs.slice().sort((a,b)=>{
    if((a.brand_probe?1:0)!==(b.brand_probe?1:0))return a.brand_probe?1:-1;
    const d=demandRank(b.id)-demandRank(a.id);
    return d||idx.get(a.id)-idx.get(b.id)});
}
function expandModal(){
  if(!EXPD){
    modal(`<h4 style="font-size:17px">拓词选题 · 来自真实搜索需求</h4>
      <p class="muted" style="font-size:12.5px;margin-top:6px">词根：品牌 + 竞品 + 品类；来源：百度下拉（国内）+ Google 补全（海外）。勾选后入库，不自动加题。</p>
      <p class="muted" style="font-size:12.5px">还没有拓词数据</p>
      <div class="row" style="justify-content:flex-end;margin-top:12px">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="closeModal();runAction('expand')">开始拓词</button></div>`);
    return}
  const cand=(EXPD.terms||[]).filter(t=>!t.in_bank);
  const groups=['推荐','比较','替代','价格','风险','品牌验证','场景'];
  const rows=groups.map(gp=>{
    const ts=cand.filter(t=>t.group===gp);
    if(!ts.length)return'';
    return `<div style="font-size:12px;color:var(--a300);margin:12px 0 4px">${gp} · ${ts.length}</div>`+
      ts.map(t=>`<label class="row" style="gap:8px;padding:6px 8px;border-radius:var(--r-sm);cursor:pointer;box-shadow:inset 0 -1px 0 var(--line);align-items:flex-start">
        <input type="checkbox" class="expchk" data-q="${esc(t.question)}" data-g="${esc(t.group)}" data-m="${esc(t.market)}" style="margin-top:3px">
        <span style="flex:1">
          <span style="font-size:13px">${esc(t.question)}</span>
          <span style="display:block;font-size:11px;color:var(--t600);margin-top:2px">${esc(t.term)} · ${esc(t.root)} · ${mktLabel(t.market)}${t.new?' · <span style="color:var(--a300)">新词</span>':''}</span>
        </span></label>`).join('');
  }).join('');
  modal(`<h4 style="font-size:17px">拓词选题 · 来自真实搜索需求</h4>
    <p class="muted" style="font-size:12px;margin-top:4px"><span>词根：品牌 + 竞品 + 品类；来源：百度下拉（国内）+ Google 补全（海外）。勾选后入库，不自动加题。</span>
      <span>${EXPD.generated_at?esc(EXPD.generated_at)+' · ':''}</span><span>${EXPD.llm?'LLM 转写':'模板转写'}</span></p>
    <div style="max-height:440px;overflow:auto;margin-top:6px">${rows||'<p class="muted" style="font-size:12.5px">候选都已入库——重新拓词看看有没有新词。</p>'}</div>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn btn-ghost" onclick="closeModal();runAction('expand')">重新拓词</button>
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="expAdd()">加入问题库</button></div>`);
}
function expAddIdx(i){
  const t=EXPD&&EXPD.terms&&EXPD.terms[i];
  if(t)expAdd([{text:t.question,group:t.group,market:t.market}]);
}
async function expAdd(items){
  if(!items){
    items=[...document.querySelectorAll('.expchk')].filter(c=>c.checked)
      .map(c=>({text:c.dataset.q,group:c.dataset.g,market:c.dataset.m}));
  }
  if(!items.length){toast('先勾选要入库的题','err');return}
  const r=await post('/api/questions-add',{slug:SLUG,items});
  toast(r.ok?`已加入 ${r.added} 题`:(r.error||'保存失败'),r.ok?'':'err');
  if(r.ok){closeModal();load(SLUG,true)}
}

        <td style="font-size:12.5px;color:${q.content==='已成稿'?'var(--a300)':'var(--t500)'}">${esc(q.content)}${(window.__pubQ||{})[q.id]?` <span class="tag tag-accent" style="font-size:10px" title="${esc(window.__pubQ[q.id])}">已发布</span>`:''}</td>
        <td><div class="row" style="gap:2px"><button class="btn btn-ghost" style="font-size:12px" onclick="go('workbench',{wq:${esc(JSON.stringify(q.id))}})">写内容</button>
          ${(window.__qFile||{})[q.id]?`<button class="btn btn-ghost" style="font-size:12px;color:var(--a300)" title="发布承接这道题的成稿：${esc(window.__qFile[q.id])}"
            onclick="pubModal(${esc(JSON.stringify('content/'+window.__qFile[q.id]))})">发布</button>`:''}</div></td></tr>`;
  }).join('');
  return `<div style="padding:32px 44px 72px;max-width:1280px">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px">
      <div>${head('现状 · 问题库',`${qs.length} 个问题，是全站所有数字的来源`,
        '「问题」= 真实用户会向 AI 提的一句问题。改这里会改变所有页面的数字。带「点名」标记的属于品牌认知探测，不计入提及率。<span style="color:var(--a300);cursor:pointer" onclick="showMethod()">问题是怎么批量生成的 →</span>')}</div>
      <div class="row" style="flex:none">
        <button class="btn btn-ghost" onclick="showMethod()">生成规则</button>
        <button class="btn btn-secondary" onclick="editQuestions()">编辑问题库</button>
        <button class="btn btn-secondary" onclick="expandModal()">拓词选题</button>
        <button class="btn btn-primary" onclick="runAction('bootstrap')">AI 补充选题</button>
      </div>
    </div>
    ${groupCards}
    <div class="row" style="margin:0 0 12px;font-size:12px;color:var(--t500)">
      ${sel?`<span class="tag tag-accent" style="cursor:pointer" onclick="ST.qGroup=null;render()">只看「${esc(sel)}」 ✕</span>
        <span style="color:var(--t600)">${qs.length} / ${all.length} 题</span>`
        :'<span style="color:var(--t600)">点上方分组卡片只看该类问题</span>'}
      <span style="margin-left:auto">${EXPD?'按「需求上升 + 未提及 + 无内容」排序 —— 顶部就是选题池':'按「未提及 + 无内容」排序 —— 顶部就是选题池'}</span>
    </div>
    <div class="tbl"><table class="table"><thead><tr>
      <th>问题</th><th style="width:70px">类别</th><th style="width:70px">市场</th>
      <th style="width:96px">你的提及</th><th style="width:96px">诊断</th><th style="width:100px">已有内容</th><th style="width:90px"></th></tr></thead><tbody>
      ${rowsHtml}
    </tbody></table></div>
  </div>`;
}
function showMethod(){
  const li=(t)=>`<li style="margin:5px 0;line-height:1.6">${t}</li>`;
  const h=(t)=>`<div style="font-size:14px;font-weight:500;margin:18px 0 4px;color:var(--a300)">${t}</div>`;
  const en=ULANG==='en';
  modal(`<h4 style="font-size:17px">${en?'Where the numbers come from — rules & metrics':'这些数字怎么来的——生成规则与指标口径'}</h4>
    <p class="muted" style="font-size:12.5px;margin-top:4px">${en?'Every metric on this site comes from batch sampling across “question bank × engine”. The rules are fixed and reproducible — full detail below.':'全站指标都来自「问题库 × 引擎」的批量采样。规则是固定的、可复现的，下面是完整口径。'}</p>

    ${h(en?'1. How the question bank is generated (brand onboarding / AI-added topics)':'一、问题库怎么批量生成（接入品牌 / AI 补充选题）')}
    <ul style="font-size:12.5px;color:var(--t400);padding-left:18px">
      ${li(en?'Only four inputs: <b>brand name, category, target user, one-line positioning</b> — all auto-extracted from the site’s homepage copy. Anything that can’t be extracted is flagged “unconfirmed” rather than guessed from common sense.':'输入只有四样：<b>品牌名、品类、目标用户、一句话定义</b>——全部从官网正文自动抽取，抽不到的标「待确认」，不用常识填充。')}
      ${li(en?'Your configured LLM writes questions from a fixed prompt, split into seven groups: <b>Recommend, Compare, Alternatives, Pricing, Risk, Brand check, Scenarios</b> — 2–4 questions per group.':'由你配置的 LLM 按固定提示词出题，分七组：<b>推荐、比较、替代、价格、风险、品牌验证、场景</b>，每组 2–4 题。')}
      ${li(en?'Question count depends on market: CN 18–24; Global 14–20; both markets = CN 16–20 + Global 12–16 + 2 general. IDs start at q001 for CN, q101 for Global, q901 for general.':'题量按市场定：国内 18–24 题；海外 14–20 题；双市场 = 国内 16–20 + 海外 12–16 + 通用 2。编号 q001 起为国内、q101 起为海外、q901 起为通用。')}
      ${li(en?'Questions must read like a real person typing: CN questions read like someone actually chatting with AI; Global questions are <b>written natively in English</b>, not translated from Chinese.':'要求真实口语问法：国内题像真人在 AI 里打的字；海外题是<b>英文原生问法</b>，不是中文题翻译。')}
      ${li(en?'<b>Key discipline: most questions never name the brand</b> — the test is whether AI thinks of you unprompted. Only the “Brand check” group names it; those are flagged “named”, counted separately as brand-awareness probes, and excluded from the mention rate.':'<b>关键纪律：绝大多数问题不出现品牌名</b>——考的是 AI 会不会主动想到你。只有「品牌验证」组点名，这类题带「点名」标记，单独归品牌认知，不计入提及率。')}
      ${li(en?'Generated questions are auto-deduplicated and checked for group/market tags; the bank can be edited manually anytime — changes take effect after the next sampling run.':'生成后自动去重、校验分组与市场标记；问题库随时可人工编辑，改完重跑采样才生效。')}
      ${li('拓词选题：以品牌/竞品/品类为词根，拉百度下拉（国内）与 Google 补全（海外）的真实搜索词，按线索词归入七组并转写成问句。只产候选、入库必须手动勾选；每期快照 diff，首次出现的词标「需求上升」，参与选题排序但不进任何指标。')}
    </ul>

    ${h(en?'2. How sampling runs':'二、采样怎么跑')}
    <ul style="font-size:12.5px;color:var(--t400);padding-left:18px">
      ${li(en?'Each round asks every question in the bank to every engine, and stores the <b>full raw answer</b> — the “sample replay” on the Engines page is that raw text.':'每期把问题库里的每道题逐个引擎各问一遍，存<b>原始回答全文</b>——引擎表现页的「样本回放」就是原文。')}
      ${li(en?'Market routing: Chinese questions only go to CN engines, English questions only go to Global engines, general questions go to both; the two markets’ metrics are computed separately, each with its own denominator.':'市场路由：中文题只问国内引擎，英文题只问海外引擎，通用题两边都问；两套市场的指标分开算，分母各用各的。')}
      ${li(en?'Engines fall into three kinds: browsing APIs (answers carry real citations), non-browsing APIs (tests brand awareness baked into the model’s parametric knowledge), and no public API (manual sampling sheet). Each row is labeled.':'引擎分三类：联网 API（回答带真实引用来源）、不联网 API（测的是模型参数化知识里的品牌认知）、无公开 API（走人工采样表）。行内已标注。')}
      ${li(en?'Every sample also logs API latency; the Engines page shows the median (resistant to timeout outliers), so sampling cost stays visible.':'每条样本同时记录 API 耗时；引擎表现页显示中位耗时（抗超时长尾），让采样成本透明。')}
      ${li(en?'<b>Result stability</b>: a single AI answer is inherently noisy, so metrics never look at one sample — they look at the aggregate ratio across “dozens of questions × multiple engines”; the model version is pinned per engine (viewable/changeable in Settings); the sampling command supports <code>--repeat</code> for multi-round denser samples; cross-round comparisons follow an attribution discipline — a single round’s swing is treated as observational only, and it only counts as a trend once two consecutive rounds move the same way.':'<b>结果稳定性</b>：单条 AI 回答天然有随机性，所以指标从不看单条——看的是「几十道题 × 多引擎」的聚合比例；模型版本按引擎固定（设置里可查可改）；采样命令支持 <code>--repeat</code> 多轮加密样本；跨期对比遵守归因纪律——单期波动默认只作观察，连续两期同向变化才当趋势。')}
    </ul>

    ${h(en?'3. Metric definitions (every column on the Engines page)':'三、指标口径（引擎表现页每一列）')}
    <ul style="font-size:12.5px;color:var(--t400);padding-left:18px">
      ${li(en?'<b>Mention</b> = share of unprompted samples where the answer names the brand (aliases included). Samples where the question itself names the brand are always excluded — otherwise it would always be 100%, a false positive. Missing aliases understate this; add them in Settings → Edit brand config.':'<b>提及率</b> = 无提示样本中，回答提到品牌（含别名）的比例。问题里点名了品牌的样本一律剔除——否则必然 100%，是假阳性。别名漏配会低估，到「设置 → 编辑当前品牌配置」补。')}
      ${li(en?'<b>Rank</b> = median position of the brand relative to other candidate brands in the answer — lower is better.':'<b>提及位次</b> = 回答里品牌相对其他候选品牌出现顺序的中位数，越小越靠前。')}
      ${li(en?'<b>Cite share</b> = share of all cited domains in the answer that are yours (subdomains included). Non-browsing engines usually have no citations and show —.':'<b>引用份额</b> = 回答引用的全部域名条数中，属于你自有域名（含子域名）的比例。不联网引擎通常没有引用，显示 —。')}
      ${li(en?'<b>Verdict</b> column rules: 0% → completely invisible; strictly higher than every other engine in the same market → best performer; ≥5% → present but unstable; &lt;5% → occasional mention; never citing your domain is flagged separately. No verdict is given when samples are too few or not comparable.':'<b>结论</b>列的判语规则：0% → 完全不可见；严格高于同市场所有引擎 → 表现最好；≥5% → 有存在感但不稳定；&lt;5% → 偶发提及；从未引用你的域名会单独标注。样本不足或无法比较时不下结论。')}
      ${li(en?'<b>GEO health score</b> = mention×30 + cite share×25 + channel coverage×20 + content readiness×15 + fact consistency×10. Untested sub-scores are not scored as 0 — the remaining weights are re-normalized instead, so “not yet measured” is never penalized like a failure.':'<b>GEO 健康分</b> = 提及率×30 + 引用份额×25 + 阵地覆盖×20 + 内容承接×15 + 事实一致性×10。没测到的项不按 0 分计，而是把权重重新归一，避免惩罚「还没测」。')}
      ${li(en?'The <b>Diagnosis</b> column (Questions / Gap Diagnosis) types each row by fixed priority: <b>Suspected negative</b> (a negative cue word hit near the brand mention, needs manual review) &gt; <b>Rival-dominated</b> (you’re at 0% and some rival is ≥50%) &gt; <b>Absent</b> (0%) &gt; <b>Low-ranked</b> (median rank &gt;3) &gt; normal. Hover the tag to see the basis.':'<b>诊断</b>列（问题库/差距诊断）按固定优先级分型：<b>疑似负面</b>（品牌附近命中负面线索词，需人工复核）&gt; <b>竞品主导</b>（你 0% 且某对手出现率 ≥50%）&gt; <b>完全缺席</b>（0%）&gt; <b>排名靠后</b>（位次中位 &gt;3）&gt; 表现正常。悬停标签可看依据。')}
      ${li(en?'<b>Suspected negative</b> only means a cue word (avoid / not recommended / complaint / scam, etc.) was found within roughly a hundred characters of the brand name — it is never auto-judged. The actual call is made by a human reviewing the sample replay; a false positive is cheaper than a missed one.':'<b>疑似负面</b>只是线索词（避雷/不推荐/投诉/scam 等）在品牌名 ±百余字符窗口内命中，不做自动定性——定性靠样本回放人工复核，误报比漏报便宜。')}
      ${li(en?'<b>Brand mention distribution / rival’s strongest engine</b>: tallies you and configured rivals (aliases merged) as they appear in answers; the denominator is the unprompted sample count for that scope, and a brand mentioned more than once in one sample still counts once. <b>Unconfigured brands are never counted</b> — the fuller your rival list and aliases, the truer the distribution.':'<b>品牌提及分布 / 竞品最强引擎</b>：统计回答中出现的你与已配置竞品（别名并入），分母为对应范围的无提示样本数，同一样本提多次只算一次。<b>未配置的品牌不计入</b>——竞品清单和别名越全，分布越真实。')}
    </ul>

    <p class="muted" style="font-size:11.5px;margin-top:10px">${en?'Implemented in scripts/bootstrap.py (question generation), expand.py (keyword mining), sample.py (sampling & judging), analytics.py (metrics) — this panel is kept in sync with the code.':'规则实现在 scripts/bootstrap.py（出题）、expand.py（拓词）、sample.py（采样与判定）、analytics.py（指标），本弹窗与代码同步维护。'}</p>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn btn-primary" onclick="closeModal()">知道了</button></div>`);
}
async function editQuestions(){
  const cfg=await api('/api/config/'+SLUG);
  const rows=(cfg.questions||[]).map(q=>`${q.id}|${q.group}|${q.market}|${q.text}`).join('\n');
  modal(`<h4 style="font-size:17px">编辑问题库</h4>
    <p class="muted" style="font-size:12px">${tr('每行一题：<code>编号|分组|市场(cn/global/both)|问题</code>。保存后重跑采样才生效。','One question per line: <code>id|group|market(cn/global/both)|question</code>. Changes take effect after the next sampling run.')}</p>
    <textarea id="qedit" class="input" rows="18">${esc(rows)}</textarea>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveQuestions()">保存</button></div>`);
}
async function saveQuestions(){
  const cfg=await api('/api/config/'+SLUG);
  const qs=[];
  for(const line of $('#qedit').value.split('\n')){
    const m=line.split('|');if(m.length<4||!m[3].trim())continue;
    qs.push({id:m[0].trim(),group:m[1].trim()||'推荐',market:['cn','global','both'].indexOf(m[2].trim())>=0?m[2].trim():'cn',text:m.slice(3).join('|').trim()});
  }
  cfg.questions=qs; if(cfg.bootstrap)cfg.bootstrap.needs_review=false;
  const r=await post('/api/config/'+SLUG,cfg);
  toast(r.ok?`已保存 ${qs.length} 题`:'保存失败',r.ok?'':'err');
  if(r.ok){closeModal();load(SLUG,true)}
}

function vGaps(){
  const a=D.analytics,qs=(a.questions||[]).filter(q=>!q.brand_probe);
  const contentGap=qs.filter(q=>q.content!=='已成稿');
  const bp=D.blueprint||{channels:[]};
  const chanGap=(bp.channels||[]).filter(c=>!c.covered&&(c.priority==='P0'||c.priority==='P1'));
  const fc=a.factcheck||[];
  const gt=ST.gapTab;
  const cards=[
    {k:'content',order:'第一步 · 先修',name:'内容缺口',v:contentGap.length,unit:'个问题没有可被抽取的答案',
     sev:'影响最大',why:'没有内容，铺阵地和改口径都没有落点。实测：含数字 +61.6%、定义 +57.3%、对比 +55.3% 被引用概率。'},
    {k:'channel',order:'第二步 · 再铺',name:'阵地缺口',v:chanGap.length,unit:'个 P0/P1 阵地未被引用',
     sev:'见效最快',why:'引擎实际会引用、你却没有内容的站点。P0 是地基。'},
    {k:'fact',order:'第三步 · 校准',name:'事实偏差',v:fc.filter(f=>f.state!=='一致').length,unit:'处口径待修或未比对',
     sev:'越曝光越亏',why:'提及率上升会放大错误说法。从「引擎表现」的样本回放里人工比对后记录在这里。'},
  ];
  const tab=(k,label)=>`<button class="btn" style="font-size:13px;${gt===k?'background:var(--a900);color:var(--a300);box-shadow:inset 0 0 0 1px var(--a700)':'color:var(--t500)'}" onclick="ST.gapTab='${k}';render()">${label}</button>`;
  let body='';
  if(gt==='content'){
    body=`<div class="tbl"><table class="table"><thead><tr><th>缺口问题</th><th style="width:70px">市场</th><th style="width:96px">你的提及</th><th style="width:96px">诊断</th><th style="width:100px">当前状态</th><th style="width:100px"></th></tr></thead><tbody>
      ${contentGap.map(q=>`<tr><td style="font-size:13.5px">${esc(q.text)}</td>
        <td style="font-size:12.5px;color:var(--t500)">${mktLabel(q.market)}</td>
        <td style="font-size:13px;color:var(--t400)">${q.mention==null?'未采样':pct(q.mention)}</td>
        <td>${diagTag(q.diagnosis)}</td>
        <td style="font-size:12.5px;color:var(--t500)">${esc(q.content)}</td>
        <td><button class="btn btn-ghost" style="font-size:12px" onclick="go('workbench',{wq:${esc(JSON.stringify(q.id))}})">生成草稿</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">没有内容缺口</td></tr>'}
    </tbody></table></div>`;
  }else if(gt==='channel'){
    body=`<div class="tbl"><table class="table"><thead><tr><th>阵地</th><th style="width:70px">优先级</th><th style="width:110px">全国引用量</th><th style="width:100px">引用位置</th><th style="width:220px">建什么</th><th style="width:100px"></th></tr></thead><tbody>
      ${chanGap.map(c=>`<tr><td style="font-size:13.5px">${esc(c.name)}</td>
        <td><span class="tag ${c.priority==='P0'?'tag-accent':'tag-dim'}">${c.priority}</span></td>
        <td style="font-size:13px;color:var(--t400)">${c.national?c.national.toLocaleString():'—'}</td>
        <td style="font-size:13px;color:var(--t400)">${c.position==null?'—':c.position}</td>
        <td style="font-size:12.5px;color:var(--t500)">${esc((c.forms||[]).slice(0,2).join(' / '))}</td>
        <td><button class="btn btn-ghost" style="font-size:12px" onclick="go('channels',{chanSel:${esc(JSON.stringify(c.name))}})">建设方案</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">P0/P1 阵地已全部覆盖</td></tr>'}
    </tbody></table></div>`;
  }else{
    body=`<div class="row" style="margin-bottom:10px">
      <span class="muted" style="font-size:12.5px">从「引擎表现 → 样本回放」发现 AI 说错的地方，记在这里。有记录后「事实一致性」才可测，健康分随之变化。</span>
      <button class="btn btn-secondary" style="margin-left:auto;font-size:12px" onclick="addFact()">+ 记一条</button></div>
    <div class="tbl"><table class="table"><thead><tr><th style="width:120px">字段</th><th>AI 说的</th><th>官方口径</th><th style="width:90px">状态</th><th style="width:56px"></th></tr></thead><tbody>
      ${fc.map((f,i)=>`<tr><td style="font-size:13px">${esc(f.field||'')}</td>
        <td style="font-size:12.5px;color:var(--a300)">${esc(f.said||'')}</td>
        <td style="font-size:12.5px;color:var(--t500)">${esc(f.truth||'')}</td>
        <td><span class="tag ${f.state==='一致'?'pill-good':'tag-accent'}">${esc(f.state||'待比对')}</span></td>
        <td><button class="btn btn-ghost" style="font-size:12px" onclick="delFact(${i})">删</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted" style="font-size:12.5px">还没有比对记录</td></tr>'}
    </tbody></table></div>`;
  }
  return `<div style="padding:32px 44px 72px;max-width:1280px">
    ${head('诊断 · 差距诊断','分数低只有三个原因，按顺序修','AI 要引用你，需要同时满足：有东西可引（内容）、在它看的地方（阵地）、说得对（事实）。三者有序——内容没写，铺阵地是白铺。')}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0 16px">
      ${cards.map(c=>`<div class="card" style="padding:18px;cursor:pointer;${gt===c.k?'box-shadow:0 0 0 1px var(--a700)':'box-shadow:var(--sh-sm)'}" onclick="ST.gapTab='${c.k}';render()">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)">${c.order}</span>
          <span class="tag ${c.k==='content'?'tag-accent':'tag-dim'}">${c.sev}</span></div>
        <div style="font-size:18px;font-weight:500;margin-top:4px">${c.name}</div>
        <div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:30px;font-weight:500">${c.v}</span>
          <span style="font-size:12px;color:var(--t600)">${c.unit}</span></div>
        <div style="font-size:12.5px;color:var(--t400);line-height:1.5">${c.why}</div>

function taskWbTarget(t){
  // 行动计划 → 工作台的落点解析：尽量落到「这条任务最该写的那道题」，而不是列表页
  for(const a of (t.assets||[])){const m=String(a).match(/\bq\d{3}\b/);if(m)return m[0]}   // 资产已带 qid
  const qs=demandSort((D.analytics.questions||[]).filter(q=>!q.brand_probe));
  const undone=qs.filter(q=>q.content!=='已成稿');
  const bm=(t.title||'').match(/「(定义|数字事实|对比|操作步骤|FAQ)」/);
  if(bm){
    // 块 → 最需要该块的问题分组（对应 blueprint GROUP_PLAN 的内容形态）
    const bg={'对比':['比较','替代'],'操作步骤':['场景'],'定义':['价格','风险','品牌验证'],
              '数字事实':['推荐','比较','场景'],'FAQ':['价格','风险']};
    const hit=undone.find(q=>(bg[bm[1]]||[]).includes(q.group));
    if(hit)return hit.id;
  }
  if(/英文|中英/.test(t.title||'')){const hit=undone.find(q=>q.market==='global');if(hit)return hit.id}
  return (undone[0]||qs[0]||{}).id||null;   // 兜底：选题池顶部
}

      ${done?`<span style="font-size:11px;color:var(--a300)" title="${esc(done.url||'')}">✓ 已发 ${esc((done.at||'').slice(5,10))}</span>`:''}
      ${ok?'':`<button class="btn btn-ghost" style="font-size:11.5px;padding:2px 8px" onclick="closeModal();go('publishing')">缺凭证 · 去配置</button>`}
    </label>`}).join('')}
    <div id="pubprog" style="margin-top:8px"></div>

      <button class="btn btn-ghost" style="margin-right:auto" onclick="closeModal();go('publishing')">渠道配置</button>

async function doPublishSel(rel){
  const codes=[...document.querySelectorAll('.pub-ch:checked')].map(e=>e.value);
  if(!codes.length){toast('先勾选至少一个渠道（没有可勾的先去设置配凭证）','err');return}
  localStorage.setItem('pubSel:'+SLUG,JSON.stringify(codes));
  const names=codes.map(c=>((PUB&&PUB.publishers)||[]).find(x=>x.code===c)?.name||c);
  if(!confirm(tr(`发布「${rel}」到 ${codes.length} 个渠道：${names.join('、')}\n\n公众号/WordPress 只建草稿。确认？`,
    `Publish “${rel}” to ${codes.length} channel(s): ${names.join(', ')}\n\nWeChat/WordPress get drafts only. Confirm?`)))return;
  const prog=$('#pubprog');let okN=0;
  for(let i=0;i<codes.length;i++){
    const line=document.createElement('div');
    line.style.cssText='font-size:12px;padding:3px 0;color:var(--t400)';
    line.textContent=`→ ${names[i]} 发布中…`;prog.appendChild(line);
    const r=await post('/api/publish/'+SLUG,{platform:codes[i],path:rel});
    if(r.ok){okN++;line.innerHTML=`✓ ${esc(names[i])} 已发布 ${r.url?`<a href="${esc(r.url)}" target="_blank" style="color:var(--a300)">${esc(r.url.slice(0,50))}</a>`:esc(r.note||'')}`}
    else line.innerHTML=`<span style="color:var(--accent)">✗ ${esc(names[i])} 失败：${esc(r.error||'')}</span>`;
  }
  toast(okN===codes.length?`已发布到 ${okN} 个渠道`:`${okN}/${codes.length} 个渠道成功，失败的看弹窗明细`,okN===codes.length?'':'err');
  PUB=null;await load(SLUG,true);   // 刷新 content_pub：计划页/问题库/清单状态同步，弹窗保留结果明细
}
async function wbSave(){

async function savePub(i){

  if(Object.keys(u).length){

      <input id="k-model" class="input" value="${k.model_set?esc(k.model):''}" placeholder="${esc(k.model)}"></div>`:''}

      ${k.ok===true?`<button class="btn btn-ghost" style="margin-right:auto" onclick="if(confirm(tr('确定从 .env 删除 ${esc(k.env)}？','Delete ${esc(k.env)} from .env?')))saveKey(${i},true)">清除 Key</button>`:''}

async function saveKey(i,clear){
  const k=KEYS[i],u={};
  if(clear)u[k.env]='';
  else{const v=$('#k-key').value.trim();if(v)u[k.env]=v}
  if(k.model_env&&!clear){
    const m=$('#k-model').value.trim();
    if(m!==(k.model_set?k.model:''))u[k.model_env]=m;
  }
  if(!Object.keys(u).length){closeModal();return}
  const r=await post('/api/keys',{updates:u});
  toast(r.ok?'已写入 .env':'失败：'+(r.error||''),r.ok?'':'err');
  if(r.ok){closeModal();KEYS=null;render()}
}

async function obCreate(){
  const url=$('#ob-url').value.trim();
  if(!url){toast('请填写官网地址','err');return}
  ST.obUrl=url;ST.obName=$('#ob-name').value.trim();
  ST.obMkt=document.querySelector('input[name=obm]:checked').value;
  // 没配任何引擎 Key：明确告知会缺什么,让用户选择继续或先去配置
  const okKeys=(KEYS||[]).filter(k=>k.ok===true);
  if(!okKeys.length&&!confirm(tr('还没有配置任何引擎 API Key。\n\n继续创建将跳过「答案采样」与「AI 推导问题库/品牌事实」——只做抓站和站点体检，问题库与品牌事实需要手动填写。\n\n建议先到「设置」配置至少一个 Key（如 DeepSeek / 智谱GLM）。\n\n仍要继续吗？',
    'No engine API keys are configured yet.\n\nContinuing will skip "answer sampling" and "AI-derived question bank / brand facts" — it will only crawl the site and run the audit; the question bank and brand facts will need manual entry.\n\nWe recommend configuring at least one key in Settings first (e.g. DeepSeek or Zhipu GLM).\n\nContinue anyway?')))
    {go('settings');return}
  const mkNeed=ST.obMkt==='both'?['cn','global']:[ST.obMkt];
  const miss=mkNeed.filter(m=>!okKeys.some(k=>k.market===m));
  if(okKeys.length&&miss.length&&!confirm(tr(`所选市场里 ${miss.map(m=>m==='cn'?'国内':'海外').join('、')} 尚无已配置的引擎 Key，该市场的自动采样会被跳过（可稍后补 Key 或用人工采样表）。\n\n仍要继续吗？`,
    `No engine keys are configured yet for ${miss.map(m=>m==='cn'?'CN':'Global').join(' / ')} — automatic sampling for that market will be skipped (you can add keys later or use a manual sampling sheet).\n\nContinue anyway?`)))
    {go('settings');return}
  ST.obNoSample=$('#ob-nosample').checked;
  const r=await post('/api/init',{url,name:ST.obName,
    market:ST.obMkt,max_pages:25});
  if(!r.ok){toast(r.error||'创建失败','err');return}
  ST.obSlug=r.slug;KEYS=null;PROJECTS=null;
  await load(r.slug,true);
  ST.obStep=2;ST.obFail=false;R='onboard';render();
  const p=ST.obNoSample?{'--no-sample':true}:{};
  const job=await runAction('autopilot',p);
  if(!job){ST.obStep=1;render();return}
}
async function obRetry(){
  ST.obFail=false;render();
  const p=ST.obNoSample?{'--no-sample':true}:{};
  const job=await runAction('autopilot',p);
  if(!job){ST.obFail=true;render()}
}

function auditFlag(i){
  // 站点体检顶部卡片的联动：robots/sitemap 直接看源文件，UA 实测跳相关工单，
  // llms.txt 去部署资产，页面可访问定位到问题页列表，语言覆盖跳相关工单
  const site=(D.brand.site||'').replace(/\/$/,'');
  const byCheck=rx=>{const t=(D.tasks||[]).find(x=>rx.test((x.acceptance||{}).check||''));if(t)taskModal(t.id);else go('plan')};
  if(i===0&&site)window.open(site+'/robots.txt','_blank');
  else if(i===1)byCheck(/^site\.no_ai_ua_block/);
  else if(i===2&&site)window.open(site+'/sitemap.xml','_blank');
  else if(i===3)go('assets',{assetSel:'llms.txt'});
  else if(i===4){const el=document.querySelector('#audit-pages');if(el)el.scrollIntoView({block:'start'})}
  else if(i===5)byCheck(/^site\.(en_pages_gte|lang_balance)/);
}

/* ===================== 部署资产 ===================== */
let AS={tree:null,cur:null,text:''};
const AS_DEST={
  '根目录':['① 上传到网站根目录','传上去后能通过 你的域名/llms.txt 直接访问；不要放进 /static/'],
  'jsonld':['② 贴进页面 <head>','不是上传 json 文件——把内容包进 <script type="application/ld+json"> 放进对应页面'],
  'snippets':['③ 贴进页面模板','定义块放首屏口号下方；FAQ 块的答案必须在静态 HTML 里可见'],
  'outlines':['④ 不上传 · 给内容团队','写作大纲——在「内容工作台」按骨架写'],
  'drafts':['⑤ 不上传 · 需先核实','AI 初稿，必须过风险检查并人工核实后才能发布'],
  'internal':['说明与索引 · 不上传','DEPLOY.md 是给开发的部署清单（含每步验收标准）'],
};
async function vAssets(){
  if(!AS.tree){const t=await api('/api/assets/'+SLUG);AS.tree=Array.isArray(t)?t:[]}
  if(ST.assetSel){const p=ST.assetSel;ST.assetSel=null; // 从站点体检等处跳来：直接打开指定文件
    if(AS.tree.some(a=>a.path===p))setTimeout(()=>asOpen(p),80)}
  const INT={'DEPLOY.md':1,'index.json':1,'_lint.json':1};
  const groups={};AS.tree.forEach(a=>{const fn=a.path.split('/').pop();
    (groups[INT[fn]?'internal':a.group]=groups[INT[fn]?'internal':a.group]||[]).push(a)});
  const order=['根目录','jsonld','snippets','internal','outlines','drafts'];
  return `<div style="padding:32px 44px 72px;max-width:1280px">
    ${head('提升 · 部署资产','系统生成的可部署产物','只有 llms.txt 是真的上传到网站根目录；JSON-LD 贴进 head，HTML 片段贴进模板，大纲和初稿不上网站。完整步骤与验收标准见 DEPLOY.md。')}
    ${D.lint&&D.lint.total?`<div class="card" style="margin:16px 0 0;box-shadow:0 0 0 1px var(--a700);padding:12px 16px">
      <div style="font-size:13px;color:var(--t400)">AI 初稿风险检查：<b>${D.lint.total}</b> 项待人工核实（高风险 ${D.lint.high}）。核实前不得发布——明细见 drafts/_lint.json。</div></div>`:''}
    <div style="display:grid;grid-template-columns:300px 1fr;gap:16px;margin-top:18px;align-items:start">
      <div class="card elev" style="padding:12px;max-height:560px;overflow:auto">
        ${AS.tree.length?order.filter(g=>groups[g]).map(g=>`
          <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t600);margin:10px 4px 4px;display:flex;justify-content:space-between">
            <span>${g==='根目录'?'llms.txt':g}</span><span style="color:var(--accent);text-transform:none;letter-spacing:0">${esc((AS_DEST[g]||[''])[0].replace(/^[①②③④⑤]\s*/,''))}</span></div>
          ${groups[g].map(a=>`<button class="navit ${AS.cur===a.path?'on':''}" style="font-size:12.5px" onclick="asOpen(${esc(JSON.stringify(a.path))})">
            <span class="mark"></span><span style="flex:1;text-align:left">${esc(a.path.split('/').pop())}</span>
            <span class="bdg">${(a.size/1024).toFixed(1)}k</span></button>`).join('')}`).join('')
          :'<div class="muted" style="font-size:12.5px;padding:8px">还没有资产——到「设置」跑「生成资产」</div>'}
      </div>
      <div id="asview" class="card elev" style="padding:16px;min-height:300px">
        ${AS.cur?'':'<div class="muted" style="font-size:13px">选一个文件查看。每个文件顶部会说明它的去处。</div>'}
      </div>
    </div>
  </div>`;
}
async function asOpen(path){
  AS.cur=path;
  const r=await api(`/api/asset/${SLUG}?path=${encodeURIComponent(path)}`);
  AS.text=r.text||'';
  await render();
  const grp=path.indexOf('/')>=0?path.split('/')[0]:'根目录';
  const fn=path.split('/').pop();
  const INT={'DEPLOY.md':1,'index.json':1,'_lint.json':1};
  const d=AS_DEST[INT[fn]?'internal':grp]||['',''];
  $('#asview').innerHTML=`
    <div class="card" style="padding:11px 14px;box-shadow:0 0 0 1px var(--a700);margin-bottom:12px;gap:3px">
      <div style="font-size:12.5px;font-weight:500">${esc(d[0])}</div>
      <div style="font-size:11.5px;color:var(--t500)">${esc(d[1])}</div></div>
    <div class="row" style="margin-bottom:8px"><b style="font-size:13px">${esc(path)}</b><span style="flex:1"></span>
      <button class="btn btn-ghost" style="font-size:12px" onclick="navigator.clipboard.writeText(AS.text);toast('已复制')">复制</button>
      <button class="btn btn-primary" style="font-size:12px" onclick="asSave()">保存修改</button></div>
    <textarea class="input" id="astext" rows="20" oninput="AS.text=this.value">${esc(AS.text)}</textarea>`;
}
async function asSave(){
  const r=await post('/api/asset/'+SLUG,{path:AS.cur,text:AS.text});
  toast(r.ok?'已保存':'失败：'+(r.error||''),r.ok?'':'err');
}

/* ===================== 样本库（答案元数据） ===================== */
let SMP=null,SMPF={date:'',platform:'',flag:''};
async function loadSamples(){
  const q=new URLSearchParams({date:SMPF.date,platform:SMPF.platform,flag:SMPF.flag,limit:'300'});
  SMP=await api(`/api/samples/${SLUG}?${q}`);
  render();
}
function vSamples(){
  if(!SMP){loadSamples();return `<div style="padding:32px 44px">${head('现状 · 样本库','读取中…','')}</div>`}
  const rows=SMP.rows||[];
  const review=rows.filter(r=>r.needs_review).length,edited=rows.filter(r=>r.manual_override).length;
  const sel=(id,val,opts,label)=>`<label class="small" style="color:var(--t500)">${label}
    <select onchange="SMPF.${id}=this.value;loadSamples()" style="background:var(--deep);color:var(--text);border:1px solid #405546;border-radius:6px;padding:4px 8px;font:inherit;font-size:12.5px;margin-left:4px">
      ${opts.map(o=>`<option value="${esc(o[0])}" ${val===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  return `<div style="padding:32px 44px 72px;max-width:1360px">
    ${head('现状 · 样本库','每条 AI 答案的元数据都在这里，可人工复核纠正',
      '机器判读用的是正则（品牌名撞词、否定语境、竞品别名都可能误判）。这里是唯一的纠正入口——改完立刻重算当日指标，改过的样本会打「人工」标记，重跑采样不会覆盖你的结论。')}
    <div class="row" style="gap:14px;margin:18px 0 12px;flex-wrap:wrap">
      ${sel('date',SMPF.date,[['','全部日期']].concat((SMP.dates||[]).map(d=>[d,d])),'日期')}
      ${sel('platform',SMPF.platform,[['','全部引擎']].concat((SMP.platforms||[]).map(p=>[p,p])),'引擎')}
      ${sel('flag',SMPF.flag,[['','全部样本'],['review','仅待复核'],['edited','仅人工改过']],'筛选')}
      <span class="small" style="color:var(--t600);margin-left:auto">共 ${SMP.total||0} 条
        ${review?` · <span style="color:var(--a300)">${review} 条待复核</span>`:''}
        ${edited?` · ${edited} 条已人工核对`:''}</span>
    </div>
    <div class="tbl"><table class="table"><thead><tr>
      <th style="width:88px">日期</th><th style="width:110px">引擎</th><th style="width:66px">来源</th>
      <th>问题</th><th style="width:74px">提及</th><th style="width:56px">位次</th>
      <th style="width:150px">竞品</th><th style="width:64px">引用</th><th style="width:96px">标记</th><th style="width:60px"></th>
    </tr></thead><tbody>
      ${rows.map(r=>`<tr ${r.needs_review?'style="background:rgba(255,178,70,.06)"':''}>
        <td style="font-size:12px;color:var(--t500)">${esc(r.date)}</td>
        <td style="font-size:12.5px">${esc(r.platform_name||r.platform)}</td>
        <td style="font-size:11px;color:var(--t600)" title="${esc((r.evidence_level||'')+(r.session_label?' · '+r.session_label:''))}">${({api:'API',manual:'手工',extension:'插件'})[r.sample_mode]||esc(r.sample_mode||'')}${r.session_mode&&r.session_mode!=='incognito'?`<div style="font-size:9.5px;color:${r.session_mode==='personal'?'var(--accent)':'var(--t700)'}">${r.session_mode==='personal'?'个人号':'专用号'}</div>`:''}</td>
        <td style="font-size:12.5px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.question||'')}">${esc(r.question||'')}</td>
        <td><span class="tag ${r.brand_mentioned?'tag-accent':'tag-dim'}">${r.brand_mentioned?'是':'否'}</span></td>
        <td style="font-size:12.5px;color:var(--t400)">${r.brand_rank||'—'}</td>
        <td style="font-size:11.5px;color:var(--t500);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc((r.competitors||[]).join('、'))}">${esc((r.competitors||[]).join('、'))||'—'}</td>
        <td style="font-size:12px;color:var(--t500)">${r.citations||0}${r.own_domain_cited?' <span style="color:var(--a300)" title="引用了官网">·官</span>':''}</td>
        <td style="font-size:11px">
          ${r.needs_review?`<span class="tag tag-accent" title="${esc((r.negative_cues||[]).join('、')||'判读存疑')}">待复核</span>`:''}
          ${r.manual_override?'<span class="tag tag-dim">人工</span>':''}</td>
        <td><button class="btn btn-ghost" style="font-size:11.5px;padding:2px 7px" onclick="sampleModal(${esc(JSON.stringify(r.key))})">查看</button></td>
      </tr>`).join('')||'<tr><td colspan="10" class="muted" style="padding:16px">没有符合条件的样本</td></tr>'}
    </tbody></table></div>

}
async function sampleModal(key){
  const r=await api(`/api/sample/${SLUG}?key=${encodeURIComponent(key)}`);
  if(!r||r.error){toast('读取失败','err');return}
  const a=r.analysis||{},cites=r.citations||[];
  modal(`<h4 style="font-size:16px">${esc(r.question||'')}</h4>
    <div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap">
      <span class="tag tag-outline">${esc(r.platform_name||r.platform)}</span>
      <span class="tag tag-dim">${esc(r.date||'')}</span>
      <span class="tag tag-dim">${esc(r.evidence_level||'')}</span>
      ${r.session_label?`<span class="tag tag-outline" title="采样环境——不同环境的样本不该混在一起算平均">${esc(r.session_label)}</span>`:''}
      ${r.manual_override?'<span class="tag tag-accent">已人工核对</span>':''}
      <span style="font-size:11.5px;color:var(--t600)">${esc(r.terminal||'')} · ${esc(r.sample_mode||'')} · ${(r.answer||'').length} 字</span></div>
    <div style="font-size:12px;color:var(--t600);margin:12px 0 3px">答案原文</div>
    <div style="max-height:210px;overflow:auto;background:var(--deep);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.65;white-space:pre-wrap;color:var(--t400)">${esc(r.answer||'')}</div>
    ${cites.length?(()=>{
      // 源站构成：这条答案的引用都来自哪些域名、各占多少——占比高的就是该题的主导信源
      const dom={};cites.forEach(c=>{try{const h=new URL(c.url).hostname.replace(/^www\./,'');dom[h]=(dom[h]||0)+1}catch(e){}});
      const own=((D.brand&&D.brand.site)||'').replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];
      const rows=Object.entries(dom).sort((a,b)=>b[1]-a[1]);
      return `<div style="font-size:12px;color:var(--t600);margin:12px 0 3px">引用（${cites.length}）· 源站构成</div>
      <div class="row" style="gap:5px;flex-wrap:wrap;margin-bottom:6px">
        ${rows.map(([h,n])=>{const mine=own&&(h===own||h.endsWith('.'+own));
          return `<span class="tag ${mine?'tag-accent':'tag-dim'}" style="font-size:11px" title="${mine?'你的官网':''}">${esc(h)} ×${n} · ${Math.round(n/cites.length*100)}%</span>`}).join('')}
      </div>
      <div style="max-height:110px;overflow:auto;font-size:11.5px;line-height:1.7">
        ${cites.map(c=>`<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><a href="${esc(c.url)}" target="_blank" style="color:var(--a300)">${esc(c.url)}</a> <span style="color:var(--t600)">${esc(c.title||'')}</span></div>`).join('')}</div>`})():''}
    <div style="font-size:12px;color:var(--t600);margin:14px 0 4px">人工复核（改完立刻重算当日指标）</div>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <label class="small">品牌被提及
        <select id="sm-men" style="background:var(--deep);color:var(--text);border:1px solid #405546;border-radius:6px;padding:4px 8px;font:inherit;margin-left:4px">
          <option value="1" ${a.brand_mentioned?'selected':''}>是</option>
          <option value="0" ${a.brand_mentioned?'':'selected'}>否</option></select></label>
      <label class="small">位次 <input id="sm-rank" class="input" style="width:64px;display:inline-block;padding:4px 8px" value="${a.brand_rank||0}"></label>
      <label class="small" style="flex:1;min-width:220px">竞品（顿号分隔）
        <input id="sm-comp" class="input" style="padding:4px 8px" value="${esc((a.competitors_mentioned||[]).join('、'))}"></label>
    </div>
    <div class="field" style="margin-top:8px"><label>复核备注</label>
      <input id="sm-note" class="input" value="${esc(r.review_note||'')}" placeholder="例：品牌名撞词，实际未提及"></div>
    ${(a.negative_cues||[]).length?`<div class="small" style="color:var(--a300);margin-top:4px">负面线索词：${esc(a.negative_cues.join('、'))}——请人工判断是否真的负面</div>`:''}
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn btn-ghost" style="margin-right:auto;color:var(--t500)" onclick="delSample(${esc(JSON.stringify(key))})">删除此样本</button>
      ${r.needs_review?`<button class="btn btn-secondary" onclick="saveSample(${esc(JSON.stringify(key))},true)">标记已复核</button>`:''}
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveSample(${esc(JSON.stringify(key))})">保存</button></div>`);
}
async function saveSample(key,clearReview){
  const comp=($('#sm-comp').value||'').split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
  const patch={brand_mentioned:$('#sm-men').value==='1',brand_rank:parseInt($('#sm-rank').value||'0',10)||0,
    competitors_mentioned:comp,review_note:$('#sm-note').value.trim()};
  if(clearReview)patch.needs_review=false;
  const r=await post('/api/sample/'+SLUG,{key,patch});
  if(!r.ok){toast(r.error||'保存失败','err');return}
  toast('已保存，当日指标已重算');closeModal();SMP=null;await load(SLUG,true);loadSamples();
}
async function delSample(key){
  if(!confirm(tr('删除这条样本？当日指标会重算，且不可恢复。','Delete this sample? That day’s metrics will be recomputed, and this cannot be undone.')))return;
  const r=await post('/api/sample/'+SLUG,{key,patch:{delete:true}});
  if(!r.ok){toast(r.error||'删除失败','err');return}
  toast('已删除，指标已重算');closeModal();SMP=null;await load(SLUG,true);loadSamples();
}

/* ===================== 框架 ===================== */
const VIEWS={overview:vOverview,engines:vEngines,competitors:vCompetitors,questions:vQuestions,
  samples:vSamples,siteaudit:vSiteAudit,assets:vAssets,
  gaps:vGaps,channels:vChannels,facts:vFacts,plan:vPlan,workbench:vWorkbench,
  verify:vVerify,report:vReport,settings:vSettings,publishing:vPublishing,onboard:vOnboard};
async function render(){
  renderSide();
  const fn=VIEWS[R]||vOverview;
  const out=fn();
  $('#view').innerHTML=(out instanceof Promise)?await out:out;
  if((R==='settings'||R==='onboard')&&RUNNING)pollJob();
}
function normAnalytics(a){
  a=(a&&!a.error)?a:{};
  const h=a.health=a.health||{};
  h.subs=h.subs||{};h.measured=h.measured||[];
  a.trend=a.trend||[];a.engines=a.engines||[];a.questions=a.questions||[];
  a.competitors=a.competitors||{};a.q_delta=a.q_delta||[];a.factcheck=a.factcheck||[];
  return a;
}
async function load(slug,keep){
  SLUG=slug;
  D=await api('/api/p/'+encodeURIComponent(slug));
  const aerr=D.error||(D.analytics&&D.analytics.error);
  D.brand=D.brand||{};D.tasks=D.tasks||[];
  D.analytics=normAnalytics(D.analytics);
  if(aerr){
    renderSide();
    $('#view').innerHTML=`<div style="padding:44px;max-width:560px">
      <h3 style="margin-bottom:10px">数据加载失败</h3>
      <p class="soft" style="font-size:13.5px">${esc(aerr)}</p>
      <div class="row" style="margin-top:14px">
        <button class="btn btn-primary" onclick="load(SLUG,true)">重试</button>
        <button class="btn btn-secondary" onclick="go('settings')">去设置</button></div>
    </div>`;
    return}
  const f=await api('/api/files/'+slug);D.samples_sheets=f.samples||[];D.deliveries=f.deliveries||[];D.reports=f.reports||[];
  EXPD=await api('/api/expand/'+slug);if(!EXPD||EXPD.error||!EXPD.terms)EXPD=null;
  const jr=await api('/api/jobs?slug='+slug);RUNNING=jr.running||null;
  AS.tree=null;   // 资产可能被任务更新过
  const hh=(location.hash||'').replace('#','');  // 支持 #路由 深链直达
  if(!keep)R=VIEWS[hh]?hh:((D.analytics&&D.analytics.latest_date)?'overview':'settings');
  history.replaceState({r:R,engSel:ST.engSel,gapTab:ST.gapTab},'','#'+R);
  render();
}
(async()=>{
  ACTIONS=await api('/api/actions');
  if(!ACTIONS||ACTIONS.error)ACTIONS={};
  const ps=await api('/api/projects');
  if(!Array.isArray(ps)){
    D={brand:{},analytics:normAnalytics(null),tasks:[]};
    renderSide();
    $('#view').innerHTML=`<div style="padding:44px;max-width:560px">
      <h3 style="margin-bottom:10px">无法连接服务</h3>
      <p class="soft" style="font-size:13.5px">${esc((ps&&ps.error)||'连接失败：服务未响应')}</p>
      <div class="row" style="margin-top:14px"><button class="btn btn-primary" onclick="location.reload()">重试</button></div>
    </div>`;
    return}
  if(!ps.length){R='onboard';ST.obStep=1;
    D={brand:{},analytics:normAnalytics(null),tasks:[]};
    render();return}
  load(ps[0].slug);
})();
</script>
